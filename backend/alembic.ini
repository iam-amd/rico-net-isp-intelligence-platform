# Alembic configuration for Rico Net backend
# ============================================
# Run migrations from the backend/ directory:
#   alembic upgrade head
#   alembic revision --autogenerate -m "description"

[alembic]
# Path to migration scripts (relative to this file)
script_location = db/migrations

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# Timezone to use when rendering the date within the migration file
# as well as the filename. string value is passed to dateutil.tz.gettz()
# leave blank for localtime
# timezone =

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command,
# regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .hierarchyped revisions to be created
# as the initial revision, when no branches exist
# prepend_sys_path = .

# Prepend the backend directory to sys.path so bare imports work
# (e.g., "from database import Base", "import models")
prepend_sys_path = .

# sqlalchemy.url is intentionally left empty here.
# It is overridden at runtime from config/settings.py → DATABASE_URL
# so that we have a single source of truth for connection strings.
sqlalchemy.url =


[post_write_hooks]
# Uncomment to run black on generated migrations:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88 REVISION_SCRIPT_FILENAME


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
